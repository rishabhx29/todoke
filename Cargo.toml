[workspace]
resolver = "3"
members = ["todoke-core", "todoke-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/todokeapp/todoke"
rust-version = "1.85"

[workspace.dependencies]
todoke-core = { path = "todoke-core" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
mdns-sd = "0.21"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
