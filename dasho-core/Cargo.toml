[package]
name = "dasho-core"
description = "Dasho transfer engine: discovery, encrypted QUIC transport, chunking, resume, receipts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
mdns-sd = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rcgen = { version = "0.14.7", features = ["crypto", "pem"] }
quinn = { version = "0.11.12", features = ["rustls", "runtime-tokio"] }
rustls = { version = "0.23.46", features = ["std"] }
fastcdc = "5.0.0"
blake3 = "1.8.7"

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
ed25519-dalek = { workspace = true }
