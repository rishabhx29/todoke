name: Release

# Build installers for every platform and attach them to a draft GitHub
# release. Trigger: push a tag (v1.0.0 → draft release with the bundles).
# Signing stays OFF until the owner provisions keys:
#   - Windows: Azure Trusted Signing → then add azure signing block + secrets
#   - macOS: Apple Developer ID + keychain import step
#   - Updater artifacts (latest.json + .sig): requires TAURI_SIGNING_PRIVATE_KEY
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install Linux dependencies (webkit2gtk et al.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Todoke ${{ github.ref_name }}"
          releaseBody: "Files that arrive. Free, open-source, no cloud, no accounts. See the website for checksums and verification instructions."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
